# 公開済みのデッキ記事の見どころを Claude API でまとめて書き直し、新しいブランチの PR にする（scripts/ai-highlight-rewrite.js）
# 手で直した印（deck-columns.json の highlightBy: "manual"）の記事は書き直さない。main には直接入れない。
# 入力欄「やること」で「要確認の記事だけ直す」を選ぶと、今の見どころをチェック役にかけ、要確認の記事だけを直す（--only-flagged。
# 問題なしの記事は変えない。manual の記事は直さず、要確認なら PR で知らせるだけ）。PR は auto/ai-highlight-fix ブランチに作る
# 「ひとことだけ作る」を選ぶと、一覧のカードに出すひとこと（tagline。30〜40字）だけを書く（--tagline-only。見どころは変えない。
# taglineBy: "manual" の記事は書かない）。PR は auto/ai-tagline ブランチに作る
# マージ前に試すときは「Use workflow from」で作業ブランチを選ぶ（PR はそのブランチ向けにできる）
# Actions タブの「Run workflow」ボタンから手動実行のみ（定期実行はしない）
#
# 事前設定:
#   - Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY を登録する（自動生成の auto-deck-sync.yml と共通）
#   - Settings → Actions → General → Workflow permissions で
#     「Allow GitHub Actions to create and approve pull requests」を有効にする（PR の作成に必要。auto-deck-sync.yml と共通）
name: AI highlight rewrite (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'やること'
        required: true
        type: choice
        default: 'すべて書き直す'
        options:
          - 'すべて書き直す'
          - '要確認の記事だけ直す'
          - 'ひとことだけ作る'
      limit:
        description: '試しに何本だけ書き直す（作る）か（例: 2。公開日が新しい順。空欄ならすべて）'
        required: false
        default: ''

permissions:
  contents: write # PR 用ブランチへのプッシュ
  pull-requests: write # PR の作成・更新

# 同時に2回走らせない（同じ PR ブランチを取り合わないように）
concurrency:
  group: ai-highlight-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    # 公式サイトのカード詳細の取得（1.5秒間隔。キャッシュにないカードだけ）と API の呼び出し（チェック役・直しの分を含め、1回の実行で最大250回）
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # scripts/*.js は .ts を直接 import するため Node 22.18 以降が必要
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # 公式のカード詳細を自動生成と共通のキャッシュから読む（読むだけで保存しない）
      - name: Restore page cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/trending
          key: trending-${{ github.run_id }}
          restore-keys: trending-

      - name: Rewrite highlights with Claude API
        # 入力はシェルに直接埋め込まず環境変数で渡す
        run: |
          if [ "$MODE" = '要確認の記事だけ直す' ]; then
            npm run ai-highlight-rewrite -- --only-flagged --limit="$LIMIT"
          elif [ "$MODE" = 'ひとことだけ作る' ]; then
            npm run ai-highlight-rewrite -- --tagline-only --limit="$LIMIT"
          else
            npm run ai-highlight-rewrite -- --limit="$LIMIT"
          fi
        env:
          MODE: ${{ github.event.inputs.mode }}
          LIMIT: ${{ github.event.inputs.limit }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 書き直した記事があるときだけ PR を作る（deck-columns.json に差分がなければ作らない。同じブランチの PR があれば更新）
      # 「要確認の記事だけ直す」で直した記事が1本もないとき（manual の記事の要確認だけなど）は PR ができないので、実行結果の Summary を見る
      # branch・title・commit-message の ${{ }} は全体を "" で囲む（title などの中の「content: 」の「: 」を YAML がキーと読み違え、
      # ワークフローのファイル全体が読めなくなるため）
      - name: Create pull request
        if: hashFiles('.cache/ai-highlight-rewrite-pr.md') != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "${{ github.event.inputs.mode == '要確認の記事だけ直す' && 'auto/ai-highlight-fix' || github.event.inputs.mode == 'ひとことだけ作る' && 'auto/ai-tagline' || 'auto/ai-highlight-rewrite' }}"
          delete-branch: true
          title: "${{ github.event.inputs.mode == '要確認の記事だけ直す' && 'content: 公開済みデッキ記事の見どころのうち、要確認の記事だけを Claude API で直す' || github.event.inputs.mode == 'ひとことだけ作る' && 'content: 公開済みデッキ記事の一覧のひとことを Claude API で作成' || 'content: 公開済みデッキ記事の見どころを Claude API で書き直し' }}"
          commit-message: "${{ github.event.inputs.mode == '要確認の記事だけ直す' && 'content: 要確認の見どころを Claude API で直す' || github.event.inputs.mode == 'ひとことだけ作る' && 'content: 一覧のひとことを Claude API で作成' || 'content: 公開済みデッキ記事の見どころを Claude API で書き直す' }}"
          body-path: .cache/ai-highlight-rewrite-pr.md
          labels: auto-deck
          add-paths: |
            src/data/deck-columns.json
