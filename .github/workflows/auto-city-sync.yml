# シティリーグだけを手動で取得したいとき用（npm run auto-city）。定期実行は auto-deck-sync.yml がジムバトルとまとめて行う
# ポケカブックのシティリーグ結果から優勝・準優勝のデッキを検知し、カード追加・デッキ解説コラムの自動生成を行って Pull Request を作成する
# デッキ名はレシピから推定するため、PR で元記事の画像と見比べて確認してからマージする
#
# 事前設定は auto-deck-sync.yml と共通（Secrets・「Allow GitHub Actions to create and approve pull requests」）
name: Auto city league sync (manual)

on:
  workflow_dispatch: # Actions タブの「Run workflow」ボタンから手動実行（定期実行はしない）
    inputs:
      max_columns:
        description: '1回に生成する記事数の上限'
        required: false
        default: '4'

permissions:
  contents: write # PR 用ブランチへのプッシュ
  pull-requests: write # PR の作成・更新

# 価格更新・auto-deck-sync と同じグループにして、楽天・Yahoo! API へのアクセスを重ねない
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 新着がない日は最新のまとめ記事を1回見るだけで終わる。新着があってもカード追加・価格取得は新しいカードの分だけ
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # scripts/*.js は .ts を直接 import するため Node 22.18 以降が必要
          cache: npm

      # node_modules を package-lock.json の内容ごとにキャッシュし、依存関係が変わっていなければ npm ci を省く
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # 公式のデッキページ・カード詳細（内容が変わらないもの）を実行間で使い回し、相手サイトへのリクエストを減らす
      - name: Restore page cache
        uses: actions/cache@v4
        with:
          path: .cache/trending
          key: trending-${{ github.run_id }}
          restore-keys: trending-

      - name: Detect new city league decks and generate columns
        run: npm run auto-city -- --max-columns=${{ github.event.inputs.max_columns || '4' }}
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 見どころを AI で書く（なければ従来の方法）

      # サイトのビルドはここでは行わない（PR のプレビュー・main へのマージ時に Vercel がビルドするため、壊れていればそこで分かる）

      # 差分があるときだけ PR を作成（同じブランチの PR があれば更新）。新着がなかった回は PR 本文が作られないので何もしない
      - name: Create pull request
        if: hashFiles('.cache/auto-city-pr.md') != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/city-sync
          delete-branch: true
          title: 'feat: 新着シティリーグ入賞デッキ記事の自動生成'
          commit-message: 'feat: 新着シティリーグ入賞デッキ記事の自動生成'
          body-path: .cache/auto-city-pr.md
          labels: auto-deck
          add-paths: |
            src/data/cards.json
            src/data/official-decks.json
            src/data/deck-columns.json
            src/pages/columns/*.astro
            scripts/cache/processed-decks.json
            scripts/seed/official-decks.json
