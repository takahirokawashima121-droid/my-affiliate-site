# ポケカブックのRSSから新着の大会入賞デッキ（ジムバトル優勝・シティリーグ優勝/準優勝）を検知し、
# 未登録カードの追加・価格取得（楽天/Yahoo!・宣伝帯なしの画像）、デッキ解説コラムと立ち回り（序盤・中盤・終盤）の自動生成を行って
# 1つの Pull Request にまとめる（npm run auto-decks → npm run auto-city。PR で内容を確認してからマージする）
#
# 事前設定:
#   - Secrets は update-prices.yml と共通（RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / YAHOO_APP_ID）。
#     見どころを Claude API で書くための ANTHROPIC_API_KEY（なくても従来の方法で記事は作られる）
#   - Settings → Actions → General → Workflow permissions で
#     「Allow GitHub Actions to create and approve pull requests」を有効にする（PR の作成に必要）
name: Auto deck sync

on:
  schedule:
    # 1日2回。毎時0分のアクセス集中・キュー待ちを避けて端数の分にする（価格更新 19:07 / 07:07 UTC とも重ならない）
    - cron: '18 23 * * *' # 23:18 UTC = 日本時間 朝 08:18（前夜・未明に追加された大会結果のチェック）
    - cron: '23 14 * * *' # 14:23 UTC = 日本時間 夜 23:23（当日開催の大会結果の収集・未登録カード追加・記事生成）
  workflow_dispatch: # Actions タブの「Run workflow」ボタンから手動実行
    inputs:
      max_columns:
        description: '1回に生成する記事数の上限（ジムバトル・シティリーグそれぞれ）'
        required: false
        default: '4'

permissions:
  contents: write # PR 用ブランチへのプッシュ
  pull-requests: write # PR の作成・更新

# 価格更新・sync-trending と同じグループにして、楽天・Yahoo! API へのアクセスを重ねない
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 新着がない日は RSS とまとめ記事を見るだけで数十秒で終わる。新着があるときは新しいカードの価格取得も行う
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # scripts/*.js は .ts を直接 import するため Node 22.18 以降が必要
          cache: npm

      # node_modules を package-lock.json の内容ごとにキャッシュし、依存関係が変わっていなければ npm ci を省く
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # 公式のデッキページ・カード詳細（内容が変わらないもの）を実行間で使い回し、相手サイトへのリクエストを減らす
      - name: Restore page cache
        uses: actions/cache@v4
        with:
          path: .cache/trending
          key: trending-${{ github.run_id }}
          restore-keys: trending-

      - name: Gym battle winners
        run: npm run auto-decks -- --max-columns=${{ github.event.inputs.max_columns || '4' }}
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 見どころを AI で書く（なければ従来の方法）

      - name: City league winners and runners-up
        run: npm run auto-city -- --max-columns=${{ github.event.inputs.max_columns || '4' }}
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 見どころを AI で書く（なければ従来の方法）

      # ジムバトル・シティリーグの PR 本文を1つにまとめる（どちらも新着がなければ本文を作らず、PR も作らない）
      - name: Combine pull request body
        run: |
          for f in .cache/auto-deck-pr.md .cache/auto-city-pr.md; do
            if [ -f "$f" ]; then cat "$f" >> .cache/auto-sync-pr.md; printf '\n---\n\n' >> .cache/auto-sync-pr.md; fi
          done

      # サイトのビルドはここでは行わない（PR のプレビュー・main へのマージ時に Vercel がビルドするため、壊れていればそこで分かる）

      # 差分があるときだけ PR を作成（同じブランチの PR があれば更新）
      - name: Create pull request
        if: hashFiles('.cache/auto-sync-pr.md') != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/deck-sync
          delete-branch: true
          title: 'feat: 新着大会入賞デッキ記事の自動生成（ジムバトル・シティリーグ）'
          commit-message: 'feat: 新着大会入賞デッキ記事の自動生成'
          body-path: .cache/auto-sync-pr.md
          labels: auto-deck
          add-paths: |
            src/data/cards.json
            src/data/official-decks.json
            src/data/deck-columns.json
            src/pages/columns/*.astro
            scripts/cache/processed-decks.json
            scripts/seed/official-decks.json
