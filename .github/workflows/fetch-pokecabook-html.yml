# ポケカブックのまとめ記事の HTML をそのままダウンロードし、実行結果のページに Artifacts として添付する（読み取りの不具合調査用）
# Claude Code の実行環境からはポケカブックにアクセスできないため、GitHub Actions で取得して確認する。
# 取得した HTML はリポジトリにはコミットしない（記事本文を転載しないため）。Artifacts は 7 日で消える
name: Fetch pokecabook HTML (manual)

on:
  workflow_dispatch: # Actions タブの「Run workflow」ボタンから手動実行
    inputs:
      urls:
        description: 取得する記事の URL（空白区切りで複数可）
        required: true
        default: https://pokecabook.com/archives/27265 https://pokecabook.com/archives/335123
  push: # 調査用ブランチでこのファイルを変更したときにも実行（main には影響しない）
    branches: ['claude/deck-name-check-parsing-asgebi']
    paths: ['.github/workflows/fetch-pokecabook-html.yml', 'scripts/debug/outline-html.js']

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # リクエストの間は 2 秒あける（収集元へのリクエストは1.5秒以上あける）
      - name: Download HTML
        env:
          URLS: ${{ github.event.inputs.urls || 'https://pokecabook.com/archives/27265 https://pokecabook.com/archives/335123' }}
        run: |
          mkdir -p pokecabook-html
          for url in $URLS; do
            name="$(echo "$url" | sed -E 's#^https?://##; s#[^A-Za-z0-9]+#_#g')"
            curl -sSL --fail -A 'Mozilla/5.0 (compatible; pokeca-factory-bot; +https://www.pokeca-factory.com/)' \
              -o "pokecabook-html/$name.html" "$url"
            echo "$url -> pokecabook-html/$name.html ($(wc -c < "pokecabook-html/$name.html") bytes)"
            sleep 2
          done

      # ●付きの行・デッキコードのリンクが、どの要素（タグ・class）の中にあるかをログに出す
      - name: Outline
        run: |
          for f in pokecabook-html/*.html; do node scripts/debug/outline-html.js "$f"; done

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: pokecabook-html
          path: pokecabook-html/
          retention-days: 7
