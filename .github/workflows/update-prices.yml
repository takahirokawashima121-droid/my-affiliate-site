# 楽天市場・Yahoo!ショッピングの販売最安値・商品画像を毎日取得し、src/data/cards.json に差分があればコミットする
# （main への push で Vercel が自動デプロイし、サイトに反映される。ここではサイトのビルドは行わない）
# 取得するのは更新時期が来たカードだけ（優先カードは毎日・それ以外は2日ごと）。詳しくは scripts/update-prices.js の冒頭
#
# 事前設定: リポジトリの Settings → Secrets and variables → Actions に以下を登録
#   RAKUTEN_APP_ID      楽天ウェブサービスのアプリID
#   RAKUTEN_ACCESS_KEY  楽天ウェブサービスのアクセスキー
#   YAHOO_APP_ID        Yahoo!デベロッパーネットワークの Client ID（未登録なら Yahoo! の取得はスキップ）
name: Update prices

# トリガーは定期実行と手動実行のみ（push トリガーは付けない）。
# 自動コミットの push で本ワークフローが再実行されることはない（ループ防止）。
# なお GITHUB_TOKEN による push は他のワークフローも起動しないが、Vercel のデプロイは通常どおり行われる。
on:
  schedule:
    # 1日2回（更新時期が来たカードだけを取得。2回で優先カードの毎日更新と、残りのカードの2日ごとの更新をまかなう）
    - cron: '7 7,19 * * *' # 07:07 / 19:07 UTC = 日本時間 16時7分 / 午前4時7分（毎時0分の混雑を避けて負荷分散）
  workflow_dispatch: # Actions タブの「Run workflow」ボタンから手動実行

permissions:
  contents: write # cards.json のコミット・プッシュに必要

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 差分更新（更新時期が来たカードだけ）。1回あたり600秒（約230枚）までで、2回の実行で全カードを2日以内に更新できる
    # （Public リポジトリのため実行時間の上限はないが、楽天・Yahoo! の呼び出し制限を守る間隔は維持する）
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # update-prices.js は Node の標準機能だけで動く（npm パッケージを使わない）ため、npm ci は行わない
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # scripts/update-prices.js は .ts を直接 import するため Node 22.18 以降が必要

      # カードごとの前回の確認日時（.cache/price-checks.json）を次回に引き継ぐ。消えた場合も updatedAt から判断して動く
      - name: Restore price check history
        uses: actions/cache@v4
        with:
          path: .cache/price-checks.json
          key: price-checks-${{ github.run_id }}
          restore-keys: price-checks-

      - name: Update prices
        run: node scripts/update-prices.js --budget=600
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}

      - name: Commit and push if cards.json changed
        run: |
          if git diff --quiet -- src/data/cards.json; then
            echo "cards.json に変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cards.json
          git commit -m "chore: daily price update"
          git pull --rebase origin main
          git push origin HEAD:main
